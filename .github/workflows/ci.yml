name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16.9-alpine
        env: { POSTGRES_USER: dsl, POSTGRES_PASSWORD: dsl, POSTGRES_DB: dsl }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U dsl" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy app
      - name: Fetch official Deriv API schemas (contract tests)
        run: |
          curl -fsSL -o /tmp/schemas.zip https://github.com/deriv-com/deriv-api-schemas/releases/latest/download/schemas.zip
          mkdir -p /tmp/deriv-schemas && unzip -q /tmp/schemas.zip -d /tmp/deriv-schemas
      - name: Tests
        env: { DERIV_SCHEMAS_DIR: /tmp/deriv-schemas }
        run: pytest -q
      - name: Migrations apply cleanly and match models (PostgreSQL)
        env: { DATABASE_URL: "postgresql+psycopg://dsl:dsl@localhost:5432/dsl" }
        run: alembic upgrade head && alembic check
      - name: Dependency audit
        run: pip install pip-audit && pip-audit --skip-editable || echo "::warning::pip-audit reported issues"

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm audit --audit-level=high --omit=dev

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t dsl-backend ./backend
      - run: docker build -t dsl-web ./frontend
