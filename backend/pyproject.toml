[project]
name = "deriv-signal-lab"
version = "0.1.0"
description = "Deriv market research and signal platform (paper/research mode, no order placement)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "websockets>=13",
    "redis>=5",
    "structlog>=24",
    "numpy>=2.0",
    "pandas>=2.2",
    "httpx>=0.27",
    "pywebpush>=2.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.11", "jsonschema>=4.22", "pandas-stubs"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["products/*.json"]

[tool.ruff]
line-length = 130
extend-exclude = ["alembic"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "S311", "RUF001", "RUF002", "RUF003", "B008", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
disallow_untyped_defs = false
plugins = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: hits the real Deriv public API (opt-in with DSL_LIVE_TESTS=1)"]
