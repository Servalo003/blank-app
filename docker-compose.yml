# Local/production-like stack. Copy .env.example to .env first.
# Behind a phone-reachable deployment, terminate TLS in front of `web` (Web Push and PWA install need HTTPS).
services:
  db:
    image: postgres:16.9-alpine
    environment:
      POSTGRES_USER: dsl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: dsl
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dsl"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7.4.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  migrate:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://dsl:${POSTGRES_PASSWORD}@db:5432/dsl
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db: { condition: service_healthy }

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://dsl:${POSTGRES_PASSWORD}@db:5432/dsl
      REDIS_URL: redis://redis:6379/0
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped

  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://dsl:${POSTGRES_PASSWORD}@db:5432/dsl
      REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "app.worker"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    restart: unless-stopped

  web:
    build: ./frontend
    ports: ["8080:8080"]
    depends_on: [api]
    restart: unless-stopped

volumes:
  pgdata:
